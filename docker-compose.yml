services:
  breedbase:
    volumes:
      - webdata:/home/production/volume
    ports:
      - 8080:8080
    image: breedbase/breedbase:latest
    depends_on:
      - breedbase_db
    container_name: breedbase_web
    cap_add:
      - SYS_ADMIN
#      - SYS_PTRACE
#    security_opt:
#      - seccomp:unconfined

  breedbase_db:
    volumes:
      - dbdatanew:/var/lib/postgresql
    image: postgres:16
    container_name: breedbase_db
    healthcheck:
      test: "pg_isready -U postgres -d $${POSTGRES_DB} || exit 1"
      interval: 10s

volumes:
  webdata:
  dbdatanew:
