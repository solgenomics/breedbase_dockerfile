services:
  breedbase:
    volumes:
      - type: bind
        source: ./sgn_local.conf
        target: /home/production/cxgn/sgn/sgn_local.conf
      - type: bind
        source: ./cxgn
        target: /home/production/cxgn
        # include .git dir that tracks all submodules in cxgn
      - type: bind
        source: .git
        target: /home/production/.git
      - shared_data:/downloads
    environment:
      MODE: 'DEVELOPMENT'
      PGDATABASE: breedbase
      PGHOST: breedbase_db
      PGPASSWORD: postgres
      PGUSER: postgres
      SGN_TEST_SERVER: http://breedbase:3010
      SGN_REMOTE_SERVER_ADDR: selenium
      DBIC_TRACE: 0
      # Optional: podman job containers (see docker-compose.yml). For
      # development, job containers also need the ./cxgn checkout and
      # sgn_local.conf; uncomment this instead of BB_JOB_MOUNTS there.
      # BB_JOB_MOUNTS: >-
      #   /var/lib/docker/volumes/breedbase_dockerfile_webdata/_data:/home/production/volume
      #   ${PWD}/cxgn:/home/production/cxgn
      #   ${PWD}/sgn_local.conf:/home/production/cxgn/sgn/sgn_local.conf
  selenium:
    container_name: selenium
    image: selenium/standalone-firefox-debug
    volumes:
      - type: bind
        source: ./cxgn/sgn/t/data
        target: /home/production/cxgn/sgn/t/data
      - shared_data:/downloads
    ports:
      - 5900:5900
      - 4444:4444

  breedbase_db:
    environment:
      POSTGRES_DB: breedbase
      POSTGRES_PASSWORD: postgres

volumes:
  shared_data:
