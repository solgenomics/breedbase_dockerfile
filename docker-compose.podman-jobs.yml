# Optional: run each background job (backend Tsp in sgn_local.conf) in its own
# podman container on the host, instead of directly inside the breedbase
# container. Use it on top of the other compose files, e.g.
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.podman-jobs.yml up -d
#
# Requirements on the host:
#   - rootful podman with its API socket enabled:
#       sudo systemctl enable --now podman.socket
#   - the breedbase image in podman's image store (podman pulls it on first use;
#     re-pull after updating the image: sudo podman pull breedbase/breedbase:latest)
#
# Job containers run as host root, like the breedbase container itself, so
# they can read and write the root-owned tempfiles the web server creates for
# them. Rootless podman does not work for that reason. Note that mounting the
# rootful podman socket gives the breedbase container root access to the host,
# the same as mounting the docker socket would.
#
# Paths in BB_JOB_MOUNTS are host paths. Job containers get the same mounts as
# the breedbase container: the web data volume (by its location in docker's
# data directory) and, for development, the ./cxgn checkout and sgn_local.conf
# from docker-compose.override.yml. Remove the last two for a production setup
# that doesn't mount ./cxgn.

services:
  breedbase:
    volumes:
      - type: bind
        source: /run/podman/podman.sock
        target: /run/podman-host/podman.sock
    environment:
      BB_JOB_PODMAN_URL: unix:///run/podman-host/podman.sock
      BB_JOB_IMAGE: ${BB_JOB_IMAGE:-docker.io/breedbase/breedbase:latest}
      BB_JOB_ADD_HOSTS: breedbase_db
      BB_JOB_MOUNTS: >-
        ${DOCKER_DATA_ROOT:-/var/lib/docker}/volumes/${COMPOSE_PROJECT_NAME:-breedbase_dockerfile}_webdata/_data:/home/production/volume
        ${PWD}/cxgn:/home/production/cxgn
        ${PWD}/sgn_local.conf:/home/production/cxgn/sgn/sgn_local.conf
      # extra podman run arguments for every job, e.g. resource limits
      BB_JOB_PODMAN_ARGS: ${BB_JOB_PODMAN_ARGS:-}
